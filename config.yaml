# --source on the CLI overrides this value.  Set this if you prefer config-only runs.
source: ""
segment_seconds: 6
retention_seconds: 900
segments_dir: data/segments
reconnect_max_backoff_seconds: 60
reanchor_threshold_seconds: 2.0
is_live: false

detection:
  baseline_seconds: 300
  warmup_seconds: 60
  z_threshold: 3.0
  single_feature_threshold: 6.0
  min_separation_seconds: 20
  sample_rate: 16000
  video_fps: 4
  reprocess_poll_seconds: 2.0
  weights:
    audio_rms_db: 1.0
    voice_energy_db: 1.0
    onset_strength: 1.0
    motion: 1.0
    cut_change: 1.0
  relative_scale_floor: 0.01
  evidence_z_threshold: 2.0
  contrast_seconds: 5
  contrast_scale_db: 2
  visual_only_penalty: 0.1
  ranking_weights:
    vocal_spike: 2.5
    audio_contrast: 1.5
    audio_spike: 0.5
    onset_spike: 0.5
    chat_surge: 2.0
    visual_activity: 0.25
  scale_floors:
    audio_rms_db: 0.5
    voice_energy_db: 0.5
    onset_strength: 0.001
    motion: 1.0
    cut_change: 0.01
  chat:
    # Shift comment timestamps onto the local file's timeline (e.g. -600 for a trim starting at 10m).
    time_offset_seconds: 0
    weights:
      chat_message_rate: 1.0
      chat_unique_chatters: 1.0
      chat_emote_density: 1.0
      chat_caps_ratio: 1.0
    scale_floors:
      chat_message_rate: 1.0
      chat_unique_chatters: 1.0
      chat_emote_density: 0.05
      chat_caps_ratio: 0.05

candidates:
  pre_roll_seconds: 25
  post_roll_seconds: 20
  min_seconds: 30
  max_seconds: 60
  merge_gap_seconds: 3
  grace_seconds: 0.5
  wait_timeout_seconds: 180
  poll_seconds: 2
  output_dir: data/candidates
  encoder: auto
  top_k: null
  clips_per_hour: 12
  min_separation_seconds: 30

# VOD-only defaults; live candidate settings above keep their current behavior.
vod:
  chunk_seconds: 300
  progress_seconds: 15
  pre_roll_seconds: 25
  post_roll_seconds: 20
  min_seconds: 30
  max_seconds: 60

selection:
  clips_per_hour: 12
  min_score: null
  min_separation_seconds: 30
  top_k: null
